name: Update episode data

# Twice a week, because the two things this needs arrive at different times and from different
# people. The episode is on Simplecast at Wed 10:00 UTC. Its comics come from all_episodes.xlsx
# and public_feed_comics.xlsx in sshugars/ircb, regenerated by a cron on someone else's machine
# at Wed 16:00 UTC — reliably to the second when it runs, and it skipped 2026-04-22, 2026-06-03
# and 2026-08-12, roughly one week in six, with no signal that it had.
#
# Wednesday's run picks up the episode an hour after that table job, or straight from the RSS
# feed if it no-showed (see append_missing in export_data.py). Thursday's is the backstop that
# catches a table arriving late, and it is the one that has always been here — the comment on
# it read "Wednesday 3am UTC" for as long as it existed, but `* * 4` is Thursday.
#
# GitHub delays scheduled runs under load: the Thursday one has been firing 04:44–05:45 UTC
# against a 03:00 cron. Both gaps are hours wide, so that drift does not reorder anything.
on:
  schedule:
    - cron: '0 17 * * 3'  # Wednesday 17:00 UTC — 1h after the upstream table job
    - cron: '0 3 * * 4'   # Thursday 03:00 UTC — backstop for a late table
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write        # to dispatch deploy.yml — see "Deploy the new data" below
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Export data
        id: export
        run: python export_data.py

      # The Secret Feed URL is per-patron: it is a credential, so it lives in repository
      # secrets and never in the tree. Skip rather than fail when it is absent, so a fork or a
      # run before the secret exists still refreshes the public half instead of going red.
      # data/patreon.json stays at whatever was last committed in that case.
      - name: Export Patreon episodes
        env:
          PATREON_RSS_URL: ${{ secrets.PATREON_RSS_URL }}
        run: |
          if [ -z "$PATREON_RSS_URL" ]; then
            echo "PATREON_RSS_URL is not set — keeping the committed data/patreon.json"
          else
            python fetch_patreon.py
          fi

      # schedule_numbers.py aligns the workbook against public/d/core.json, which is a build
      # artifact and not in the tree. So the numbering needs a build on each side of it: one
      # to give it the feed to align against, one so the rows it writes actually attach to
      # the data this job commits.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install node dependencies
        run: npm ci

      - name: Build data
        run: node scripts/build-data.mjs

      # Episode numbers live only in the private IRCB Schedule workbook, and this is the one
      # automated way in: an Apps Script web app in its owner's account (see
      # scripts/schedule-webapp.gs) serving the numbering columns as JSON. It replaces a
      # by-hand xlsx download that had to happen every fortnight, and that nobody remembered
      # to do for 29 months.
      #
      # Never fatal, for the same reason the flags at the bottom of this file run last: a CSV
      # that is a fortnight stale still numbers every episode but the newest one or two, and
      # failing here would discard an otherwise good refresh over it. If it really is behind,
      # "Flag episode numbers that have fallen behind" is the step that says so.
      - name: Refresh episode numbers
        env:
          SCHEDULE_WEBAPP_URL: ${{ secrets.SCHEDULE_WEBAPP_URL }}
        run: |
          if [ -z "$SCHEDULE_WEBAPP_URL" ]; then
            echo "SCHEDULE_WEBAPP_URL is not set — keeping the committed data/episode-numbers.csv"
          elif python scripts/schedule_numbers.py "$SCHEDULE_WEBAPP_URL"; then
            node scripts/build-data.mjs
          else
            # csv.DictWriter truncates on open, so a crash partway through leaves a short
            # file. Put the committed one back rather than commit a CSV missing 400 rows.
            echo "::warning::the schedule web app did not answer — data/episode-numbers.csv is unchanged"
            git checkout -- data/episode-numbers.csv
          fi

      # Re-count after the refresh, not before it. "Export data" printed a count taken
      # against the CSV as it arrived from the last commit, so a run that has just topped the
      # CSV up would still fail on it. Runs whether or not the refresh did, so a fork without
      # the secret keeps the warning it always had.
      - name: Recheck episode numbers
        id: numbers
        run: python export_data.py --check-numbers

      - name: Commit updated data
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/comics.json data/episodes.json data/patreon.json \
                  data/episode-numbers.csv data/tag-taxonomy.json
          # NO [skip ci] HERE. It was correct when the site was "deploy from a branch" and the
          # raw files in the repo *were* the site, so a data commit updated it with no build.
          # The site is a Vite build now: `npm run build` runs scripts/build-data.mjs, and
          # that step is the only thing that regenerates public/d/*.json.
          git diff --staged --quiet && exit 0
          git commit -m "chore: update episode data"
          git push
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      # Removing [skip ci] above was necessary but not sufficient, and for a while it looked
      # like the fix: pushes made with GITHUB_TOKEN do not trigger `on: push` workflows at all.
      # That is GitHub's recursion guard, and it is why neither Deploy nor Run tests fired on
      # the data commits of 2026-08-12 or 2026-08-13 — the refresh landed on main and the live
      # site stayed frozen until a human happened to push something unrelated.
      #
      # workflow_dispatch is the documented exception to that guard, so ask for the deploy by
      # name. Only when something was actually committed: a week with no data change has
      # nothing to publish.
      - name: Deploy the new data
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy.yml --ref main

      # Last on purpose. The upstream cron in sshugars/ircb skipped 2026-04-22, 2026-06-03 and
      # 2026-08-12 without saying so, and the August one was only found because someone noticed
      # the site looked wrong a day later. A red job here is an email.
      #
      # It runs after the commit and the deploy because a table that is behind is not a reason
      # to withhold the episode — append_missing has already published it from the feed, and it
      # is only comics and timestamps that are waiting. Failing earlier would trade a missing
      # timestamp for a missing episode, which is the bug this all started with.
      - name: Flag an upstream table that is behind
        if: always() && steps.export.outputs.stale != ''
        run: |
          echo "::error::sshugars/ircb has not indexed ${{ steps.export.outputs.stale }} public episode(s). The site is serving them from RSS, so nothing is missing from the listing — but they have no comics or timestamps until that table catches up. Check whether the weekly job ran."
          exit 1

      # Same shape and for the same reason: last, non-blocking, and it exists because the
      # silent version of this went unnoticed for five months. Episode numbers live only in
      # the private IRCB Schedule workbook — there is no itunes:episode tag in the feed and
      # they cannot be counted out — so data/episode-numbers.csv is topped up by hand and the
      # real failure is forgetting to. An episode with no number just renders without an EP.
      # line, which looks deliberate.
      - name: Flag episode numbers that have fallen behind
        if: always() && steps.numbers.outputs.unnumbered != ''
        run: |
          echo "::error::${{ steps.numbers.outputs.unnumbered }} episodes have aired since the newest row in data/episode-numbers.csv, so they ship with no EP. number. The refresh runs automatically now, so this means the IRCB Schedule workbook itself has no row for them, or the web app could not be reached — check the workbook first, then the SCHEDULE_WEBAPP_URL secret against scripts/schedule-webapp.gs. By hand: python scripts/schedule_numbers.py <workbook.xlsx>"
          exit 1
