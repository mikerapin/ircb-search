name: Deploy to Pages

# The site is a Vite build now, not raw files served from the repo root: `npm run build`
# regenerates data/*.json into public/d/*.json and emits hashed assets. Pages must publish
# that artifact, so the repo's Pages source has to be set to "GitHub Actions".
#
# The custom domain is a REPO SETTING, not something the artifact carries. This comment used
# to say public/CNAME was what kept search.ircbpodcast.com alive across an artifact deploy;
# that was tested at the merge and is false. With the Pages setting cleared, a deploy whose
# dist/ contained a correct CNAME file did NOT restore the domain — the file is just served
# at /CNAME. Restoring it took `gh api -X PUT .../pages -f cname=search.ircbpodcast.com`.
#
# Keep the file and the assertion below anyway: it costs nothing, it is what the legacy
# branch builder read, and a missing CNAME in dist is still a signal the build went wrong.
# But do not believe it will save the domain.
#
# Re-adding the domain is also what finally provisioned TLS. The cert had never been issued
# (https_certificate was null, https_enforced false, and the site was HTTP-only); clearing
# and re-setting cname moved it to authorization_pending → approved within minutes.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let the weekly data commit and a manual run queue rather than cancel each other.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Fail if the custom domain did not survive the build
        run: test -f dist/CNAME && test -s dist/d/core.json

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
