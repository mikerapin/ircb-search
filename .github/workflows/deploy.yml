name: Deploy to Pages

# The site is a Vite build now, not raw files served from the repo root: `npm run build`
# regenerates data/*.json into public/d/*.json and emits hashed assets. Pages must publish
# that artifact, so the repo's Pages source has to be set to "GitHub Actions".
#
# public/CNAME carries search.ircbpodcast.com into dist/ — without it the custom domain
# drops on the first artifact deploy.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let the weekly data commit and a manual run queue rather than cancel each other.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Fail if the custom domain did not survive the build
        run: test -f dist/CNAME && test -s dist/d/core.json

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
